<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <link rel="stylesheet" href="card.css">
    <script src="card.js" defer></script>

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="Shows a character card with functional health and level meters">
    <meta property="og:url" content="https://jrchil01.github.io/wdd131/charactercard/index.html">
    <meta property="og:image" content="snortleblat.jpg">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card">
    <meta name="twitter:description" content="Shows a character card with functional health and level meters">
    <meta name="twitter:image" content="snortleblat.jpg">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
</head>
<body>
    <section class="card">
        <img src="snortleblat.jpg" class="image" alt="An image of a crocodilian fantasy creature">
        <h1 class="name">s</h1>
        <div class="stats">

        </div>
        <div class="buttons">
            <button id="attack">Attacked</button>
            <button id="levelUp">Level Up</button>
        </div>
    </section>
</body>
</html>
