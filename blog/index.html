<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <meta name="author" content="Jennie Childers">
    <meta name="description" content="Blog with book reviews">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script defer src="blog.js"></script>
</head>
<body>
    <header>
        <h1>Kids Read For Fun</h1>
        <nav>
            <a href="#">About</a>
            <a href="#">Archive</a>
            <a href="#">Search</a>
        </nav>
    </header>
    <main>
        <div class="book-review">
            <div class="info-card">
                 <p>${article.date}</p>
                <p>${article.ages}</p>
                <p>${article.genre}</p>
                <p>${article.stars}</p>
            </div>
            
            <div class="review">
                <h2>${article.title}</h2>
                <img src="${article.imgSrc}" alt="${articles.imgAlt}">
                <p>${article.description}</p>
            </div>
        </div>
    </main>
    <footer>
        <p>Jennie Childers</p>
    </footer>
</body>
</html>
